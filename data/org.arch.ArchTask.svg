<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e222a"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1793d1"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00ffb4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#2c323f" stroke-width="2"/>

  <!-- Grid lines background -->
  <path d="M24 40 H104 M24 64 H104 M24 88 H104" stroke="#2a303d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M44 24 V104 M64 24 V104 M84 24 V104" stroke="#2a303d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Arch Linux Logo Triangle Element -->
  <path d="M64 20 L94 92 L76 92 L64 56 L52 92 L34 92 Z" fill="#1793d1" opacity="0.25"/>

  <!-- Dynamic Heartbeat / Task Graph Line -->
  <path d="M 20 68 L 40 68 L 48 42 L 58 84 L 68 32 L 80 74 L 90 58 L 108 58" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Glowing Graph Nodes -->
  <circle cx="48" cy="42" r="3.5" fill="#00d2ff"/>
  <circle cx="68" cy="32" r="4" fill="#00ffb4"/>
  <circle cx="80" cy="74" r="3.5" fill="#1793d1"/>
</svg>
